<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Google Sheets PKCE Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
    }
    button {
      padding: 10px 16px;
      font-size: 14px;
    }
    ul {
      margin-top: 20px;
      padding-left: 0;
    }
    li {
      list-style: none;
      padding: 8px;
      border-bottom: 1px solid #ddd;
      cursor: pointer;
    }
    li:hover {
      background: #f3f3f3;
    }
    #selected {
      margin-top: 20px;
      font-weight: bold;
      color: #0b5;
    }
  </style>
</head>
<body>

<h2>Pick a Google Sheet</h2>

<button id="login">Sign in with Google</button>

<ul id="sheetList"></ul>

<div id="selected"></div>

<script>
/* =======================
   CONFIG
======================= */
const clientId = "YOUR_CLIENT_ID_HERE";
const redirectUri = "https://death259.github.io/AnimalOps/pkce_test.html";
const scope = "https://www.googleapis.com/auth/drive.metadata.readonly";

const authEndpoint = "https://accounts.google.com/o/oauth2/v2/auth";
const tokenEndpoint = "https://oauth2.googleapis.com/token";

/* =======================
   PKCE HELPERS
======================= */
function generateCodeVerifier() {
  const array = new Uint8Array(32);
  crypto.getRandomValues(array);
  return btoa(String.fromCharCode(...array))
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

async function generateCodeChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest("SHA-256", data);
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

/* =======================
   LOGIN FLOW
======================= */
document.getElementById("login").onclick = async () => {
  const verifier = generateCodeVerifier();
  const challenge = await generateCodeChallenge(verifier);
  sessionStorage.setItem("pkce_verifier", verifier);

  const params = new URLSearchParams({
    client_id: clientId,
    response_type: "code",
    redirect_uri: redirectUri,
    scope,
    code_challenge: challenge,
    code_challenge_method: "S256",
    prompt: "consent"
  });

  window.location.href = `${authEndpoint}?${params.toString()}`;
};

/* =======================
   HANDLE REDIRECT
======================= */
async function handleRedirect() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if (!code) return;

  const verifier = sessionStorage.getItem("pkce_verifier");

  const body = new URLSearchParams({
    client_id: clientId,
    grant_type: "authorization_code",
    code,
    redirect_uri: redirectUri,
    code_verifier: verifier
  });

  const tokenResponse = await fetch(tokenEndpoint, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body
  });

  const tokenData = await tokenResponse.json();
  history.replaceState({}, document.title, redirectUri);

  loadSheets(tokenData.access_token);
}

/* =======================
   LOAD GOOGLE SHEETS
======================= */
async function loadSheets(accessToken) {
  const response = await fetch(
    "https://www.googleapis.com/drive/v3/files" +
    "?q=mimeType='application/vnd.google-apps.spreadsheet'" +
    "&fields=files(id,name)",
    {
      headers: {
        Authorization: `Bearer ${accessToken}`
      }
    }
  );

  const data = await response.json();
  const list = document.getElementById("sheetList");
  list.innerHTML = "";

  if (!data.files || data.files.length === 0) {
    list.innerHTML = "<li>No spreadsheets found</li>";
    return;
  }

  data.files.forEach(sheet => {
    const li = document.createElement("li");
    li.textContent = sheet.name;
    li.onclick = () => {
      document.getElementById("selected").textContent =
        `Selected Spreadsheet ID: ${sheet.id}`;

      console.log("Spreadsheet ID:", sheet.id);
    };
    list.appendChild(li);
  });
}

handleRedirect();
</script>

</body>
</html>
