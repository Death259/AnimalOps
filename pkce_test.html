<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Google Sheets Picker (PKCE)</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button { padding: 10px 14px; }
    ul { margin-top: 20px; }
    li { cursor: pointer; margin: 6px 0; }
    li:hover { background: #eee; }
    #output { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

<h2>Google Sheets Picker (PKCE)</h2>
<button id="login">Sign in with Google</button>

<ul id="files"></ul>
<div id="output"></div>

<script>
const clientId = "365835275822-kds4lbq9stu5ov9qt9cddq2v3ck3dkgl.apps.googleusercontent.com";
const redirectUri = window.location.origin + window.location.pathname;
const scope = "https://www.googleapis.com/auth/drive.metadata.readonly";
const authEndpoint = "https://accounts.google.com/o/oauth2/v2/auth";
const tokenEndpoint = "https://oauth2.googleapis.com/token";

document.getElementById("login").onclick = async () => {
  console.log("Login button clicked");

  const verifier = generateCodeVerifier();
  const challenge = await generateCodeChallenge(verifier);
  sessionStorage.setItem("pkce_verifier", verifier);

  const params = new URLSearchParams({
    client_id: clientId,
    response_type: "code",
    redirect_uri: redirectUri,
    scope,
    code_challenge: challenge,
    code_challenge_method: "S256",
    access_type: "online",
    prompt: "consent"
  });

  const url = `${authEndpoint}?${params.toString()}`;
  console.log("Redirecting to:", url);

  window.location.href = url;
};


// ---------- PKCE helpers ----------
function generateCodeVerifier() {
  const array = new Uint8Array(32);
  crypto.getRandomValues(array);
  return btoa(String.fromCharCode(...array))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function generateCodeChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest("SHA-256", data);
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

// ---------- OAuth flow ----------
document.getElementById("login").onclick = async () => {
  const verifier = generateCodeVerifier();
  const challenge = await generateCodeChallenge(verifier);
  sessionStorage.setItem("pkce_verifier", verifier);

  const params = new URLSearchParams({
    client_id: clientId,
    response_type: "code",
    redirect_uri: redirectUri,
    scope,
    code_challenge: challenge,
    code_challenge_method: "S256",
    access_type: "online",
    prompt: "consent"
  });

  window.location = `${authEndpoint}?${params.toString()}`;
};

// ---------- Handle redirect ----------
async function handleRedirect() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if (!code) return;

  const verifier = sessionStorage.getItem("pkce_verifier");

  const body = new URLSearchParams({
    client_id: clientId,
    grant_type: "authorization_code",
    code,
    redirect_uri: redirectUri,
    code_verifier: verifier
  });

  const tokenResponse = await fetch(tokenEndpoint, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body
  });

  const tokenData = await tokenResponse.json();
  loadSheets(tokenData.access_token);
  history.replaceState({}, document.title, redirectUri);
}

// ---------- Drive API ----------
async function loadSheets(token) {
  const res = await fetch(
    "https://www.googleapis.com/drive/v3/files" +
    "?q=mimeType='application/vnd.google-apps.spreadsheet'" +
    "&fields=files(id,name)",
    {
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  const data = await res.json();
  const list = document.getElementById("files");

  data.files.forEach(file => {
    const li = document.createElement("li");
    li.textContent = file.name;
    li.onclick = () => {
      document.getElementById("output").textContent =
        `Selected Spreadsheet ID: ${file.id}`;
      console.log("Spreadsheet ID:", file.id);
    };
    list.appendChild(li);
  });
}

handleRedirect();
</script>

</body>
</html>
